name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.10'
  NODE_VERSION: '22'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Test frontend
        working-directory: web
        run: npm test -- --run

      - name: Verify source
        run: |
          go test ./...
          go vet ./...
          npm --prefix web test -- --run
          npm --prefix web run typecheck

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIME="$build_time"
          mkdir -p dist
          for target in "windows amd64 exe" "linux amd64 noext" "linux arm64 noext"; do
            read -r goos goarch suffix <<<"$target"
            if [[ "$suffix" == "exe" ]]; then ext=.exe; else ext=; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$commit -X main.buildTime=$build_time" -o "dist/relaylab-${goos}-${goarch}${ext}" ./cmd/relaylab
            if [[ ! -d cmd/relaylab-launcher ]]; then
              echo 'cmd/relaylab-launcher is required for a release' >&2
              exit 1
            fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/relaylab-launcher-${goos}-${goarch}${ext}" ./cmd/relaylab-launcher
          done
          printf '%s  %s\n' "$commit" > dist/BUILD_COMMIT
          printf '%s\n' "$build_time" > dist/BUILD_TIME

      - name: Generate checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha256sum dist/relaylab-* > dist/SHA256SUMS
          python - "$version" "$(git rev-parse HEAD)" <<'PY'
          import hashlib, json, os, pathlib, platform, re, sys
          version, commit = sys.argv[1:]
          root = pathlib.Path('dist')
          assets = []
          pattern = re.compile(r'^relaylab(?:-launcher)?-(windows|linux)-(amd64|arm64)(\.exe)?$')
          for path in sorted(root.iterdir()):
              match = pattern.match(path.name)
              if not match:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({'name': path.name, 'os': match.group(1), 'arch': match.group(2), 'size': path.stat().st_size, 'sha256': digest})
          manifest = {'version': version, 'commit': commit, 'build_time': os.environ.get('BUILD_TIME', ''), 'launcher_protocol': 1, 'database_schema': 1, 'assets': assets}
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
