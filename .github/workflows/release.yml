name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'

jobs:
  actual-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify actual upgrade and recovery on amd64
        env:
          RELAYLAB_UPGRADE_INTEGRATION: '1'
        run: go test ./cmd/relaylab -run TestActualBinaryUpgradeAndRecovery -count=1 -timeout=360s
      - name: Verify Windows stop fallback guards
        if: runner.os == 'Windows'
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-stop.ps1

  release:
    needs: actual-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and Chinese release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version), 'stable VERSION required'
          if os.environ['RELEASE_REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match VERSION'
          assert pathlib.Path('docs/releases/v' + version + '.md').is_file(), 'Chinese release notes required'
          PY

      - name: Set up Go from module baseline
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: |
          go mod download
          npm --prefix web ci

      - name: Verify source and packaging
        run: |
          go test ./... -count=1 -timeout=5m
          go vet ./...
          npm --prefix web test
          npm --prefix web run typecheck
          python -m unittest discover -s scripts -p 'test_release.py' -v

      - name: Build embedded frontend
        run: |
          npm --prefix web run build
          node scripts/notices.mjs

      - name: Verify concurrency on Linux
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/launcher ./internal/update ./internal/runtimecontrol ./internal/server ./internal/worker -count=1 -timeout=5m

      - name: Build and validate complete release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py --tag "$RELEASE_TAG"
          python scripts/release.py --tag "$RELEASE_TAG" --validate-only

      - name: Upload draft, verify, then publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_release.py --tag "$RELEASE_TAG"
