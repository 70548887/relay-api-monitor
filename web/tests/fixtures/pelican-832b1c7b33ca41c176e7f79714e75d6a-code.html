<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>

  <style>
    :root {
      --ink: #243449;
      --cream: #fff8e9;
      --yellow: #f5c542;
      --orange: #ef8645;
      --coral: #ed6b6b;
      --blue: #4b87b7;
      --green: #94b879;
      --road: #36485d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, #354f72 0 12%, transparent 13%),
        linear-gradient(145deg, #14253e, #263d5d 55%, #40536e);
      font-family:
        Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .scene {
      width: min(100%, 1040px);
      overflow: hidden;
      border: 10px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: #f7d79b;
      box-shadow:
        0 30px 80px rgba(8, 19, 35, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .title {
      fill: var(--ink);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .subtitle {
      fill: #54677e;
      font-size: 13px;
      letter-spacing: 0.18em;
    }

    .cloud {
      animation: cloudMove 18s linear infinite;
    }

    .cloud.slow {
      animation-duration: 28s;
      animation-delay: -8s;
    }

    .sun-glow {
      animation: sunPulse 4s ease-in-out infinite;
      transform-origin: 780px 135px;
    }

    .pelican {
      animation: riderBounce 0.52s ease-in-out infinite alternate;
      transform-origin: 480px 330px;
    }

    .wing {
      animation: wingFlutter 0.52s ease-in-out infinite alternate;
      transform-origin: 480px 290px;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheelSpin 1.05s linear infinite;
    }

    .crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheelSpin 1.05s linear infinite;
    }

    .pedal-left {
      animation: pedalLeft 1.05s linear infinite;
      transform-box: view-box;
      transform-origin: 500px 425px;
    }

    .pedal-right {
      animation: pedalRight 1.05s linear infinite;
      transform-box: view-box;
      transform-origin: 500px 425px;
    }

    .road-dash {
      animation: roadMove 1.05s linear infinite;
    }

    .bird-shadow {
      animation: shadowPulse 0.52s ease-in-out infinite alternate;
      transform-origin: 496px 512px;
    }

    .spark {
      animation: sparkle 2.5s ease-in-out infinite;
    }

    .spark:nth-child(2) {
      animation-delay: -0.8s;
    }

    .spark:nth-child(3) {
      animation-delay: -1.5s;
    }

    @keyframes cloudMove {
      from {
        transform: translateX(-100px);
      }

      to {
        transform: translateX(1040px);
      }
    }

    @keyframes sunPulse {
      0%,
      100% {
        opacity: 0.75;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes riderBounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(4px);
      }
    }

    @keyframes wingFlutter {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-6deg);
      }
    }

    @keyframes wheelSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pedalLeft {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pedalRight {
      from {
        transform: rotate(180deg);
      }

      to {
        transform: rotate(540deg);
      }
    }

    @keyframes roadMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-180px);
      }
    }

    @keyframes shadowPulse {
      from {
        transform: scaleX(0.9);
        opacity: 0.23;
      }

      to {
        transform: scaleX(1.05);
        opacity: 0.13;
      }
    }

    @keyframes sparkle {
      0%,
      100% {
        opacity: 0.25;
        transform: translateY(3px) scale(0.8);
      }

      50% {
        opacity: 1;
        transform: translateY(-4px) scale(1.1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene" aria-label="一只鹈鹕骑自行车的 SVG 2D 动画">
    <svg
      viewBox="0 0 980 620"
      role="img"
      aria-labelledby="svg-title svg-desc"
      xmlns="http://www.w3.org/2000/svg"
    >
      <title id="svg-title">鹈鹕骑自行车</title>
      <desc id="svg-desc">
        一只戴着小帽子的鹈鹕在夕阳下骑着蓝色自行车，车轮和双腿持续运动。
      </desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f9c98e" />
          <stop offset="55%" stop-color="#f8dfac" />
          <stop offset="100%" stop-color="#dce5ca" />
        </linearGradient>

        <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9aba82" />
          <stop offset="100%" stop-color="#6d9d7c" />
        </linearGradient>

        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#475c70" />
          <stop offset="100%" stop-color="#27394e" />
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
          <feGaussianBlur stdDeviation="5" />
        </filter>

        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="8" />
        </filter>

        <pattern id="roadTexture" width="36" height="36" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="7" r="1" fill="#607286" opacity="0.25" />
          <circle cx="28" cy="22" r="1" fill="#15283d" opacity="0.18" />
          <circle cx="16" cy="31" r="0.8" fill="#8a9aab" opacity="0.18" />
        </pattern>
      </defs>

      <!-- 天空 -->
      <rect width="980" height="620" fill="url(#sky)" />

      <g class="sun-glow">
        <circle cx="780" cy="135" r="70" fill="#ffd988" opacity="0.25" filter="url(#glow)" />
        <circle cx="780" cy="135" r="46" fill="#ffe7a7" />
        <circle cx="780" cy="135" r="36" fill="#fff1bf" />
      </g>

      <!-- 云 -->
      <g class="cloud" fill="#fff9e7" opacity="0.65">
        <path d="M-110 155 C-87 129 -53 132 -38 153 C-16 116 41 121 53 159 C86 151 108 172 110 196 L-115 196 Z" />
      </g>

      <g class="cloud slow" fill="#ffffff" opacity="0.42">
        <path d="M-180 85 C-163 63 -128 64 -113 87 C-85 48 -30 61 -26 95 C8 84 32 103 36 126 L-180 126 Z" />
      </g>

      <!-- 远景山丘 -->
      <path
        d="M0 360 C125 287 220 319 304 353 C405 394 492 305 595 331 C712 359 755 299 860 330 C912 345 952 344 980 330 L980 500 L0 500 Z"
        fill="#a6bd87"
      />

      <path
        d="M0 398 C91 345 175 356 264 392 C362 431 427 352 518 365 C610 378 671 345 749 370 C838 400 899 359 980 372 L980 505 L0 505 Z"
        fill="url(#hill)"
      />

      <!-- 小树 -->
      <g fill="#4c846f" opacity="0.85">
        <path d="M105 351 l25 -52 l25 52 h-14 l17 32 h-56 l17 -32z" />
        <path d="M855 353 l21 -43 l21 43 h-12 l14 28 h-48 l14 -28z" />
        <path d="M926 366 l16 -33 l17 33 h-9 l11 23 h-38 l11 -23z" />
      </g>

      <!-- 草地 -->
      <path d="M0 444 C160 421 313 442 477 431 C682 418 820 451 980 433 L980 620 L0 620 Z" fill="#b4c98b" />
      <path d="M0 475 C189 449 342 475 524 458 C708 441 849 477 980 456 L980 620 L0 620 Z" fill="url(#road)" />
      <path d="M0 475 C189 449 342 475 524 458 C708 441 849 477 980 456 L980 620 L0 620 Z" fill="url(#roadTexture)" opacity="0.85" />

      <!-- 道路边缘 -->
      <path d="M0 482 C190 458 345 483 524 467 C705 450 846 485 980 465" fill="none" stroke="#dce0cd" stroke-width="5" opacity="0.75" />
      <path d="M0 597 C183 574 367 594 542 578 C717 562 840 590 980 575" fill="none" stroke="#dce0cd" stroke-width="5" opacity="0.75" />

      <!-- 移动中的道路虚线 -->
      <g class="road-dash" fill="#f8e5a8" opacity="0.8">
        <rect x="40" y="532" width="86" height="8" rx="4" />
        <rect x="230" y="526" width="86" height="8" rx="4" />
        <rect x="420" y="520" width="86" height="8" rx="4" />
        <rect x="610" y="515" width="86" height="8" rx="4" />
        <rect x="800" y="510" width="86" height="8" rx="4" />
        <rect x="990" y="504" width="86" height="8" rx="4" />
      </g>

      <!-- 标题 -->
      <text x="58" y="76" class="title">SUNSET RIDE</text>
      <text x="60" y="102" class="subtitle">鹈鹕的黄昏骑行</text>

      <!-- 地面阴影 -->
      <ellipse class="bird-shadow" cx="500" cy="514" rx="218" ry="21" fill="#10273c" opacity="0.2" filter="url(#softShadow)" />

      <!-- 自行车 -->
      <g aria-label="自行车">
        <!-- 后轮 -->
        <g class="wheel">
          <circle cx="345" cy="444" r="78" fill="none" stroke="#263b50" stroke-width="13" />
          <circle cx="345" cy="444" r="68" fill="none" stroke="#83bdd0" stroke-width="3" opacity="0.8" />
          <g stroke="#83bdd0" stroke-width="3" opacity="0.72">
            <path d="M345 444 L345 366" />
            <path d="M345 444 L400 389" />
            <path d="M345 444 L423 444" />
            <path d="M345 444 L400 499" />
            <path d="M345 444 L345 522" />
            <path d="M345 444 L290 499" />
            <path d="M345 444 L267 444" />
            <path d="M345 444 L290 389" />
          </g>
          <circle cx="345" cy="444" r="9" fill="#f5c542" stroke="#263b50" stroke-width="5" />
        </g>

        <!-- 前轮 -->
        <g class="wheel">
          <circle cx="650" cy="444" r="78" fill="none" stroke="#263b50" stroke-width="13" />
          <circle cx="650" cy="444" r="68" fill="none" stroke="#83bdd0" stroke-width="3" opacity="0.8" />
          <g stroke="#83bdd0" stroke-width="3" opacity="0.72">
            <path d="M650 444 L650 366" />
            <path d="M650 444 L705 389" />
            <path d="M650 444 L728 444" />
            <path d="M650 444 L705 499" />
            <path d="M650 444 L650 522" />
            <path d="M650 444 L595 499" />
            <path d="M650 444 L572 444" />
            <path d="M650 444 L595 389" />
          </g>
          <circle cx="650" cy="444" r="9" fill="#f5c542" stroke="#263b50" stroke-width="5" />
        </g>

        <!-- 车架 -->
        <g fill="none" stroke="#e96f5c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M345 444 L438 368 L500 444 L345 444" />
          <path d="M438 368 L500 444 L650 444" />
          <path d="M500 444 L558 348 L650 444" />
          <path d="M558 348 L584 327" />
        </g>

        <!-- 车架高光 -->
        <path d="M352 440 L438 375 L493 440" fill="none" stroke="#ffad70" stroke-width="3" opacity="0.8" />

        <!-- 座椅 -->
        <path d="M411 358 Q439 346 465 357" fill="none" stroke="#263b50" stroke-width="9" stroke-linecap="round" />
        <path d="M439 361 L438 375" stroke="#263b50" stroke-width="7" stroke-linecap="round" />

        <!-- 车把 -->
        <path d="M554 348 Q582 327 584 314 Q584 302 597 300" fill="none" stroke="#263b50" stroke-width="8" stroke-linecap="round" />
        <path d="M594 300 l23 4" stroke="#263b50" stroke-width="8" stroke-linecap="round" />

        <!-- 链条 -->
        <ellipse cx="500" cy="444" rx="32" ry="12" fill="none" stroke="#f4c84f" stroke-width="3" opacity="0.85" />

        <!-- 曲柄 -->
        <g class="crank">
          <circle cx="500" cy="444" r="14" fill="#f5c542" stroke="#263b50" stroke-width="5" />
          <path d="M500 444 L530 420" stroke="#263b50" stroke-width="6" stroke-linecap="round" />
          <path d="M530 420 h25" stroke="#263b50" stroke-width="6" stroke-linecap="round" />
          <path d="M500 444 L470 468" stroke="#263b50" stroke-width="6" stroke-linecap="round" />
          <path d="M445 468 h25" stroke="#263b50" stroke-width="6" stroke-linecap="round" />
        </g>
      </g>

      <!-- 鹈鹕 -->
      <g class="pelican" aria-label="鹈鹕">
        <!-- 尾羽 -->
        <path d="M420 326 Q383 342 394 366 Q419 352 444 339 Z" fill="#d9e0d4" stroke="#263b50" stroke-width="5" />
        <path d="M420 333 Q389 362 408 375 Q429 355 449 342 Z" fill="#c3d2cd" stroke="#263b50" stroke-width="4" />

        <!-- 身体 -->
        <ellipse cx="472" cy="302" rx="72" ry="68" fill="#f5f1df" stroke="#263b50" stroke-width="6" />
        <path d="M425 319 Q461 345 511 326 Q529 314 539 292 Q529 350 477 363 Q438 356 425 319 Z" fill="#d3dcd5" opacity="0.9" />

        <!-- 翅膀 -->
        <g class="wing">
          <path d="M468 274 Q518 252 537 288 Q548 311 524 331 Q492 347 454 317 Q474 302 468 274 Z" fill="#d4ddd8" stroke="#263b50" stroke-width="6" />
          <path d="M478 287 Q506 293 524 311" fill="none" stroke="#9aabb0" stroke-width="4" stroke-linecap="round" />
          <path d="M470 301 Q499 309 516 323" fill="none" stroke="#9aabb0" stroke-width="4" stroke-linecap="round" />
          <path d="M468 315 Q488 323 504 330" fill="none" stroke="#9aabb0" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- 脖子 -->
        <path d="M470 263 Q454 225 472 194 Q489 172 521 184 Q538 200 519 230 L503 276 Z" fill="#f3eedb" stroke="#263b50" stroke-width="6" />
        <path d="M478 202 Q488 224 478 258" fill="none" stroke="#c5d2cd" stroke-width="8" opacity="0.8" />

        <!-- 头 -->
        <circle cx="506" cy="171" r="42" fill="#f7f0dc" stroke="#263b50" stroke-width="6" />

        <!-- 小帽子 -->
        <path d="M474 143 Q502 111 533 137 L538 151 L478 157 Z" fill="#ef8065" stroke="#263b50" stroke-width="5" />
        <path d="M471 151 Q504 145 541 153" fill="none" stroke="#f5c542" stroke-width="8" stroke-linecap="round" />
        <path d="M501 128 Q505 113 518 116" fill="none" stroke="#f5c542" stroke-width="6" stroke-linecap="round" />

        <!-- 眼睛 -->
        <circle cx="524" cy="165" r="8" fill="#263b50" />
        <circle cx="527" cy="162" r="2.5" fill="#ffffff" />

        <!-- 鹈鹕长喙 -->
        <path d="M531 178 Q583 177 625 202 Q590 227 531 201 Q516 192 531 178 Z" fill="#ed9c53" stroke="#263b50" stroke-width="6" />
        <path d="M532 190 Q579 192 617 203" fill="none" stroke="#c56b43" stroke-width="4" />
        <path d="M600 196 Q625 202 630 210 Q609 218 591 213" fill="#e67f4c" />

        <!-- 腿和脚 -->
        <g fill="none" stroke="#d77647" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M463 347 Q470 378 490 407 L500 438" />
          <path d="M500 438 L528 423" />
          <path d="M500 438 L527 440" />

          <path d="M492 349 Q508 378 521 396 L470 464" />
          <path d="M470 464 L443 465" />
          <path d="M470 464 L492 474" />
        </g>

        <!-- 脚部运动强调 -->
        <g class="pedal-left" opacity="0.001">
          <circle cx="500" cy="438" r="2" />
        </g>
        <g class="pedal-right" opacity="0.001">
          <circle cx="470" cy="464" r="2" />
        </g>
      </g>

      <!-- 飞溅的小星星 -->
      <g class="spark" fill="#fff4c9">
        <path d="M176 285 l4 11 l11 4 l-11 4 l-4 11 l-4-11 l-11-4 l11-4 Z" />
      </g>

      <g class="spark" fill="#fff4c9">
        <path d="M735 282 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3 Z" />
      </g>

      <g class="spark" fill="#fff4c9">
        <path d="M690 345 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3 Z" />
      </g>

      <!-- 右下角装饰文字 -->
      <text x="822" y="580" fill="#e8d9ac" font-size="12" letter-spacing="0.2em">
        KEEP MOVING
      </text>
    </svg>
  </main>
</body>
</html>
