server:
  address: "127.0.0.1:42783"
  data_dir: "./data"
  # Browser-facing origin for HTTPS reverse proxies, e.g. https://relay.example.com.
  # Keep empty for direct local access. Do not include a path or credentials.
  public_url: ""

# Optional DNS-over-HTTPS JSON resolver for proxy Fake-IP environments.
# Only synthetic DNS answers use this fallback; private addresses remain blocked.
# Example: https://1.1.1.1/dns-query (only domain/type are sent; no API keys).
upstream:
  dns_over_https: "${RELAYLAB_UPSTREAM_DNS_OVER_HTTPS}"

# ========== 服务端自更新配置 ==========
update:
  enabled: true
  # binary permits installation through the launcher; container only checks releases.
  install_mode: binary
  github_owner: "70548887"
  github_repo: "relay-api-monitor"
  # Keep credentials outside this file in production.
  github_token: "${RELAYLAB_UPDATE_GITHUB_TOKEN}"
  # Check at startup and every 6 hours. Set 0 to check manually only.
  check_interval: 21600
  proxy: "${RELAYLAB_UPDATE_PROXY}"
  auto_download: false
  auto_restart: true
  backup_dir: "./data/backups"
